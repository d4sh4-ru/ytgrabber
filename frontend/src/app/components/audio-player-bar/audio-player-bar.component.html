@if (currentTrack) {
    <div class="audio-bar">
        <audio
            #audioElement
            hidden
            [src]="currentTrack.src"
            autoplay
            (timeupdate)="onTimeUpdate()"
            (loadedmetadata)="onLoadedMetadata()"
            (play)="onPlay()"
            (pause)="onPause()"
            (ended)="onPause()"
            (seeked)="onSeeked()"
            (error)="onError()"
        ></audio>

        @if (currentTrack.coverSrc) {
            <img class="audio-bar__cover" [src]="currentTrack.coverSrc" alt="" />
        } @else {
            <span
                class="audio-bar__cover"
                [style.background]="tone.background"
                [style.color]="tone.foreground"
            >
                <app-icon name="music" [size]="18" />
            </span>
        }

        <button
            type="button"
            class="audio-bar__toggle"
            [attr.aria-label]="isPlaying ? 'Пауза' : 'Воспроизвести'"
            (click)="onTogglePlay()"
        >
            <app-icon [name]="isPlaying ? 'pause' : 'play'" [size]="16" />
        </button>

        <p class="audio-bar__title" [title]="currentTrack.title">{{ currentTrack.title }}</p>

        <div class="audio-bar__scrubber">
            <span class="audio-bar__time">{{ currentTimeLabel }}</span>
            <input
                class="audio-bar__range"
                type="range"
                min="0"
                max="100"
                step="0.1"
                aria-label="Позиция"
                [value]="progressPercent"
                [style.--progress]="progressPercent + '%'"
                (input)="onSeek($event)"
            />
            <span class="audio-bar__time">{{ durationLabel }}</span>
        </div>

        <button
            type="button"
            class="btn btn--ghost btn--icon audio-bar__close"
            aria-label="Закрыть плеер"
            (click)="onClose()"
        >
            <app-icon name="close" [size]="18" />
        </button>
    </div>
}
