@if (currentTrack) {
    <div class="audio-player-bar">
        <audio
            #audioElement
            hidden
            [src]="currentTrack.src"
            autoplay
            (timeupdate)="onTimeUpdate()"
            (loadedmetadata)="onLoadedMetadata()"
            (play)="onPlay()"
            (pause)="onPause()"
            (ended)="onPause()"
        ></audio>

        <button type="button" class="audio-player-bar__toggle" (click)="onTogglePlay()">
            {{ isPlaying ? '⏸' : '▶' }}
        </button>

        <div class="audio-player-bar__body">
            <p class="audio-player-bar__title" [title]="currentTrack.title">{{ currentTrack.title }}</p>
            <div class="audio-player-bar__scrubber">
                <span class="audio-player-bar__time">{{ currentTimeLabel }}</span>
                <input class="audio-player-bar__range"
                       type="range"
                       min="0"
                       max="100"
                       step="0.1"
                       [value]="progressPercent"
                       (input)="onSeek($event)"/>
                <span class="audio-player-bar__time">{{ durationLabel }}</span>
            </div>
        </div>
    </div>
}
