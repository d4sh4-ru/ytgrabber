<div class="scanner" role="dialog" aria-modal="true" aria-label="Сканирование QR-кода">
    <video #video class="scanner__video" playsinline muted></video>
    @if (!error) {
        <div class="scanner__frame" aria-hidden="true">
            <span class="scanner__corner scanner__corner--tl"></span>
            <span class="scanner__corner scanner__corner--tr"></span>
            <span class="scanner__corner scanner__corner--bl"></span>
            <span class="scanner__corner scanner__corner--br"></span>
        </div>
    }
    <div class="scanner__top">
        <p class="scanner__hint">
            {{ error || 'Наведите камеру на QR-код из «Настройки → Устройства → Войти на другом»' }}
        </p>
        <button
            type="button"
            class="scanner__close"
            title="Закрыть"
            aria-label="Закрыть"
            (click)="onClose()"
        >
            <app-icon name="close" [size]="18" />
        </button>
    </div>
</div>
