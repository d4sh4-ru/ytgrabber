<div class="scanner" role="dialog" aria-modal="true" aria-label="Сканирование QR-кода">
    <video #video class="scanner__video" playsinline muted></video>
    @if (!error) {
        <div class="scanner__frame" aria-hidden="true"></div>
    }
    <div class="scanner__top">
        <span class="scanner__hint">
            {{ error || 'Наведите камеру на QR-код из «Настройки → Устройства → Войти на другом»' }}
        </span>
        <button
            type="button"
            class="btn scanner__close"
            title="Закрыть"
            aria-label="Закрыть"
            (click)="onClose()"
        >
            <app-icon name="close" [size]="18" />
        </button>
    </div>
</div>
