<form class="download-form" (submit)="onSubmit($event)">
    <input
        class="download-form__input"
        type="text"
        [placeholder]="placeholder"
        [formControl]="urlControl"
        [class._invalid]="isInvalid"
    />
    <select class="download-form__quality" [formControl]="qualityControl">
        @for (option of qualityOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
        }
    </select>
    <button class="download-form__submit" type="submit" [disabled]="isSubmitting">Добавить</button>
</form>
@if (hasAccounts) {
    <label
        class="download-form__option"
        title="Для публичных видео: подключённый аккаунт сайта не используется"
    >
        <input type="checkbox" [formControl]="withoutAccountControl" />
        Скачать без аккаунта
    </label>
}

<div class="vertical-divider"></div>

<app-job-list [jobs]="jobs"></app-job-list>
