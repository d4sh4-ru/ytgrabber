<div
    class="media-card"
    [class.media-card--missing]="item.fileMissing"
    role="button"
    tabindex="0"
    (click)="onOpen()"
    (keydown.enter)="onOpen()"
>
    <div class="media-card__cover">
        @if (item.thumbnailUrl) {
            <img class="media-card__image" [src]="thumbnailSrc" [alt]="item.title" loading="lazy" />
        } @else if (isAudio) {
            <span class="media-card__icon"><app-icon name="music" [size]="32" /></span>
        }
        @if (item.fileMissing) {
            <span class="media-card__badge">Файл не найден</span>
        }
        @if (watchedPercent; as percent) {
            <div class="media-card__watched" [title]="watchedTitle">
                <div class="media-card__watched-bar" [style.width.%]="percent"></div>
            </div>
        }
        <div class="media-card__actions">
            @if (!item.fileMissing) {
                @if (isDesktop) {
                    <button
                        type="button"
                        class="btn"
                        title="Показать в папке"
                        aria-label="Показать в папке"
                        (click)="onReveal($event)"
                    >
                        <app-icon name="folder" />
                    </button>
                } @else {
                    <a
                        class="btn"
                        [title]="isDesktopApp ? 'Скачать на компьютер' : 'Скачать на устройство'"
                        [attr.aria-label]="
                            isDesktopApp ? 'Скачать на компьютер' : 'Скачать на устройство'
                        "
                        download
                        [href]="downloadUrl"
                        (click)="onDownload($event)"
                    >
                        <app-icon name="download" />
                    </a>
                }
            }
            <button
                type="button"
                class="btn btn--danger"
                title="Удалить"
                aria-label="Удалить"
                (click)="onDelete($event)"
            >
                <app-icon name="trash" />
            </button>
        </div>
    </div>
    <p class="media-card__title" [title]="item.title">{{ item.title }}</p>
    <span class="media-card__duration">{{ durationLabel ?? '&nbsp;' }}</span>

    <!-- Outside the actions (they fade out without hover) and kept from
         opening the player: the dialog's clicks would bubble to the card. -->
    @if (downloadWarning) {
        <span
            class="media-card__dialog"
            (click)="$event.stopPropagation()"
            (keydown)="$event.stopPropagation()"
        >
            <app-confirm-dialog
                title="Скачать по мобильной сети?"
                confirmLabel="Скачать"
                [message]="downloadWarning"
                (confirmed)="onDownloadConfirmed()"
                (cancelled)="onDownloadCancelled()"
            />
        </span>
    }
</div>
