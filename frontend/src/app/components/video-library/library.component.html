<div class="library__header">
    <h1 class="page-title library__title">Библиотека</h1>
    <nav class="segmented" aria-label="Тип медиа">
        <button
            type="button"
            class="segmented__item"
            [class.segmented__item--active]="activeGroup === 'video'"
            [attr.aria-pressed]="activeGroup === 'video'"
            (click)="setGroup('video')"
        >
            Видео <span class="library__count">({{ videoItems.length }})</span>
        </button>
        <button
            type="button"
            class="segmented__item"
            [class.segmented__item--active]="activeGroup === 'audio'"
            [attr.aria-pressed]="activeGroup === 'audio'"
            (click)="setGroup('audio')"
        >
            Аудио <span class="library__count">({{ audioItems.length }})</span>
        </button>
    </nav>
</div>

@if (visibleItems.length === 0) {
    <div class="library__empty">
        <div class="library__empty-art" aria-hidden="true">
            <span class="library__empty-frame library__empty-frame--left"></span>
            <span class="library__empty-frame library__empty-frame--right"></span>
            <span class="library__empty-frame library__empty-frame--front">
                <app-icon [name]="activeGroup === 'video' ? 'video' : 'music'" [size]="22" />
            </span>
        </div>
        <p class="library__empty-title">
            {{ activeGroup === 'video' ? 'Нет скачанных видео' : 'Нет скачанного аудио' }}
        </p>
        <p class="library__empty-text">
            Вставьте ссылку на вкладке «Загрузки» — скачанное появится здесь.
        </p>
        <button type="button" class="btn" (click)="addRequested.emit()">
            <app-icon name="plus" [size]="16" />
            Добавить ссылку
        </button>
    </div>
} @else {
    <div class="library__grid">
        @for (item of visibleItems; track item.id) {
            <app-media-card
                [item]="item"
                [isCurrent]="item.id === (currentTrackId$ | async)"
                (opened)="onOpened($event)"
                (revealed)="onRevealed($event)"
                (deleteRequested)="onDeleteRequested($event)"
            />
        }
    </div>
}

@if (pendingDelete) {
    <app-confirm-dialog
        [title]="'Удалить «' + pendingDelete.title + '»?'"
        [message]="isDesktop ? 'Запись исчезнет из библиотеки.' : 'Файл будет удалён с сервера.'"
        confirmLabel="Удалить"
        [optionLabel]="isDesktop ? 'Также удалить файл с диска' : ''"
        [option]="!pendingDelete.fileMissing"
        (confirmed)="onDeleteConfirmed($event)"
        (cancelled)="onDeleteCancelled()"
    />
}
