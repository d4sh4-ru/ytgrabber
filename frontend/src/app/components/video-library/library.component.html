<nav class="video-library__tabs">
    <button
        type="button"
        class="video-library__tab"
        [class.video-library__tab--active]="activeGroup === 'video'"
        (click)="setGroup('video')"
    >
        Видео ({{ videoItems.length }})
    </button>
    <button
        type="button"
        class="video-library__tab"
        [class.video-library__tab--active]="activeGroup === 'audio'"
        (click)="setGroup('audio')"
    >
        Аудио ({{ audioItems.length }})
    </button>
</nav>

@if (visibleItems.length === 0) {
    <p class="video-library__empty">
        {{ activeGroup === 'video' ? 'Нет скачанных видео' : 'Нет скачанного аудио' }}
    </p>
} @else {
    <div class="video-library__grid">
        @for (item of visibleItems; track item.id) {
            <app-media-card
                [item]="item"
                (opened)="onOpened($event)"
                (revealed)="onRevealed($event)"
                (deleteRequested)="onDeleteRequested($event)"
            />
        }
    </div>
}

@if (pendingDelete) {
    <app-confirm-dialog
        [title]="'Удалить «' + pendingDelete.title + '»?'"
        message="Запись исчезнет из библиотеки."
        confirmLabel="Удалить"
        optionLabel="Также удалить файл с диска"
        [option]="!pendingDelete.fileMissing"
        (confirmed)="onDeleteConfirmed($event)"
        (cancelled)="onDeleteCancelled()"
    />
}
