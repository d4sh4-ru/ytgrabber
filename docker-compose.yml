# ytgrabber-server reachable only through Tailscale.
#
# The server shares the network of the tailscale container: nothing is
# published on the host, and `tailscale serve` gives it HTTPS at
# https://ytgrabber.<your-tailnet>.ts.net.
#
#   1. Create an auth key at https://login.tailscale.com/admin/settings/keys
#      and put it into .env as TS_AUTHKEY=tskey-auth-...
#   2. docker compose up -d
#   3. docker compose logs ytgrabber | grep "access token"
#
# Without Tailscale: drop the tailscale service and network_mode, and
# publish the port on the address of your VPN interface, e.g.
#   ports: ["10.8.0.1:8080:8080"]

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ytgrabber
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale:/var/lib/tailscale
      - ./deploy/tailscale-serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  ytgrabber:
    image: ytgrabber-server
    build: .
    network_mode: service:tailscale
    environment:
      # Reachable only inside the tailscale container's network.
      YTG_LISTEN: 0.0.0.0:8080
    volumes:
      - data:/data
      - media:/media
    restart: unless-stopped

volumes:
  tailscale:
  data:
  media:
