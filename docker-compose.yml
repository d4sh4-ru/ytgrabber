# ytgrabber-server with Docker Compose.
#
#   docker compose up -d
#   docker compose logs ytgrabber | grep "access token"
#
# The server is meant to be reached through your VPN or a TLS reverse
# proxy, not straight from the internet. The port is published on
# localhost only; to reach it from other devices, use the address of
# your VPN interface instead (e.g. "10.8.0.1:8080:8080") or put a
# reverse proxy with HTTPS in front of it.

services:
  ytgrabber:
    image: ghcr.io/d4sh4-ru/ytgrabber-server:latest
    # Built from this checkout if the image can't be pulled.
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # yt-dlp is checked for updates this often (0 turns it off) ...
      YTG_YTDLP_UPDATE: 24h
      # ... from its stable releases or the nightly builds.
      YTG_YTDLP_CHANNEL: stable
    volumes:
      - data:/data
      - media:/media
    restart: unless-stopped

volumes:
  data:
  media:
