name: Release

# Pushing a version tag builds the app for every supported platform and
# publishes a GitHub release with the binaries:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# A tag with a suffix (v1.2.0-rc.1) becomes a pre-release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v2.13.0

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: build ${{ matrix.name }}
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            platform: darwin/universal
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
            arch: amd64
          - name: windows-arm64
            os: windows-latest
            platform: windows/arm64
            arch: arm64
          # Linux builds run on the oldest supported Ubuntu so the binary
          # works on distributions with an older glibc too.
          - name: linux-amd64
            os: ubuntu-22.04
            platform: linux/amd64
            tags: webkit2_41
          - name: linux-arm64
            os: ubuntu-22.04-arm
            platform: linux/arm64
            tags: webkit2_41
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $tag is not a version like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          # Bundle metadata (Info.plist, Windows resources, NSIS) only takes X.Y.Z.
          echo "numeric=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          if ! command -v makensis >/dev/null; then
            choco install nsis -y --no-progress
            echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"
          fi

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Stamp version into wails.json
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("wails.json", "utf8"));
            config.info.productVersion = process.argv[1];
            fs.writeFileSync("wails.json", JSON.stringify(config, null, 2) + "\n");
          ' "${{ steps.version.outputs.numeric }}"

      - name: Build
        run: |
          args=(-clean -platform "${{ matrix.platform }}" -ldflags "-X ytgrabber/internal/app.Version=${{ steps.version.outputs.version }}")
          if [ -n "${{ matrix.tags }}" ]; then args+=(-tags "${{ matrix.tags }}"); fi
          if [ "${{ runner.os }}" = "Windows" ]; then args+=(-nsis); fi
          wails build "${args[@]}"
          ls -la build/bin

      - name: Package
        run: |
          version="${{ steps.version.outputs.version }}"
          base="ytgrabber-${version}-${{ matrix.name }}"
          mkdir -p dist
          case "${{ runner.os }}" in
            macOS)
              ditto -c -k --keepParent build/bin/ytgrabber.app "dist/${base}.zip"
              ;;
            Windows)
              cp build/bin/ytgrabber.exe "dist/${base}-portable.exe"
              cp build/bin/*installer.exe "dist/${base}-setup.exe"
              ;;
            Linux)
              mkdir -p "pkg/${base}"
              cp build/bin/ytgrabber build/linux/ytgrabber.desktop build/linux/install.sh "pkg/${base}/"
              cp build/appicon.png "pkg/${base}/ytgrabber.png"
              tar -C pkg -czf "dist/${base}.tar.gz" "${base}"
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Release notes
        run: |
          cat > notes.md <<'NOTES'
          ## Установка

          | Система | Файл |
          |---|---|
          | macOS (Apple Silicon и Intel) | `…-macos-universal.zip` — распакуйте и перенесите `ytgrabber.app` в «Программы» |
          | Windows | `…-windows-amd64-setup.exe` (установщик) или `…-portable.exe`; для ARM — `…-windows-arm64-…` |
          | Linux | `…-linux-amd64.tar.gz` / `…-linux-arm64.tar.gz` — распакуйте и запустите `./install.sh` |

          yt-dlp, ffmpeg и deno можно установить прямо из приложения: «Настройки → Внешние программы».

          Сборки не подписаны. macOS при первом запуске заблокирует приложение — снимите карантин:
          `xattr -dr com.apple.quarantine /Applications/ytgrabber.app`. Windows SmartScreen: «Подробнее → Выполнить в любом случае».

          Контрольные суммы файлов — в `SHA256SUMS.txt`.
          NOTES

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "YT Grabber ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --generate-notes \
            "${flags[@]}"
