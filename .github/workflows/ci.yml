name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the full CI before building release assets.
  workflow_call:

permissions:
  contents: read

env:
  WAILS_VERSION: v2.13.0

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            race: -race
          - os: windows-latest
            race: ""
          - os: ubuntu-24.04
            race: -race
            # Ubuntu 24.04 ships only webkit2gtk-4.1; wails links 4.0 without this tag.
            tags: webkit2_41
    runs-on: ${{ matrix.os }}
    env:
      GOFLAGS: ${{ matrix.tags && format('-tags={0}', matrix.tags) || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # Builds the frontend, generates the TS bindings the frontend tests
      # import, and compiles the app — so it runs before the test steps.
      - name: Build app
        shell: bash
        run: |
          if [ -n "${{ matrix.tags }}" ]; then
            wails build -tags "${{ matrix.tags }}"
          else
            wails build
          fi

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test ${{ matrix.race }} ./...

      - name: Frontend format check
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npm run format:check

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: ytgrabber-${{ runner.os }}
          path: build/bin/
          retention-days: 7
